name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS platform
        run: flutter create --project-name wrestling_brackets --org kz.temirpride --platforms ios .

      - name: Set app display name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Сетки по борьбе" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Сетки по борьбе" ios/Runner/Info.plist

      - name: Get packages
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr wrestling_brackets.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: wrestling_brackets-ios
          path: wrestling_brackets.ipa
          retention-days: 14